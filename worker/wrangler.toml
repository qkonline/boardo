# Boardo's API. Deploy from this folder with `npx wrangler deploy`. Secrets:
# `npx wrangler secret put RESEND_API_KEY`, `FILE_SIGNING_KEY` and `VAPID_PRIVATE_KEY` (and
# `TURNSTILE_SECRET` to turn Turnstile on, with TURNSTILE_SITE_KEY below). Database changes go in
# migrations/ and are applied with `npx wrangler d1 migrations apply boardo --remote`.
name = "boardo-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
# The app lives at boardo.kaiserkhan.com, served by this Worker with the API under /api (since
# 23 Oct 2026; before, the app was at kaiserkhan.com/boardo/ on Hostinger). workers.dev stays on
# for app versions from before, which call the API there at the root.
routes = [{ pattern = "boardo.kaiserkhan.com", custom_domain = true }]

# The built app (`npm run build` first). /api/* always reaches the Worker; any other path that
# isn't one of the app's files does too (the old root API paths on workers.dev).
[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
# boardo.kaiserkhan.com is the app.
ALLOWED_ORIGINS = "https://boardo.kaiserkhan.com"
# kaiserkhan.com (and www) is the old address, whose last build hands each copy over to the new
# one: it may call only the routes that needs (FAREWELL in src/index.ts).
LEGACY_ORIGINS = "https://kaiserkhan.com,https://www.kaiserkhan.com"
# Local copies of the app (Vite, previews, Elastic's): let in only when running locally, with
# DEV_MAIL set in .dev.vars.
DEV_ORIGINS = "http://localhost:5174,http://localhost:4174,http://localhost:5173,http://localhost:4173,http://localhost:8788"
APP_URL = "https://boardo.kaiserkhan.com/"
# Passkeys belong to kaiserkhan.com, so the ones made at kaiserkhan.com/boardo/ keep working here.
# They're only taken from the app's own address (APP_URL), never from the old one.
RP_ID = "kaiserkhan.com"
MAIL_FROM = "Boardo <boardo@kaiserkhan.com>"
# Alerts on phones and computers (Web Push). The private key is a secret: VAPID_PRIVATE_KEY.
VAPID_PUBLIC_KEY = "BCZwduUiNMJZ_BYrLGtasWl7xFWR8_wkpwNtifm4KakkDilqYXPd-QdgnF1R8F4-bUBHUHdXArWJH5-Uiq9xyzc"
VAPID_SUBJECT = "https://boardo.kaiserkhan.com/"
# Turnstile on asking for a sign-in code: off until this and the secret TURNSTILE_SECRET are both
# set (and VITE_TURNSTILE_SITE_KEY, the same key, in .env.production for the app).
# TURNSTILE_SITE_KEY = ""

[[durable_objects.bindings]]
name = "BOARDS"
class_name = "Board"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Board"]

# Requests per network to the routes that need no sign-in (index.ts, OPEN). Elastic's Worker
# uses namespace 1001, so the two keep separate counts.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# Requests per signed-in person to the routes that write (index.ts, WRITES), so no one account
# can use up the day's database writes.
[[ratelimits]]
name = "USER_LIMITER"
namespace_id = "1012"
simple = { limit = 60, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "boardo"
database_id = "80adce19-ab9f-4910-970f-e7d11ec23795"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "boardo-files"

# Elastic's Worker, told whose cards changed (src/notify.ts). It calls back through its own
# binding to the ElasticLink entrypoint (src/link.ts).
[[services]]
binding = "ELASTIC"
service = "elastic-day-push"
entrypoint = "BoardoHooks"

[observability]
enabled = true
